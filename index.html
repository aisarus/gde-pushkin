<title>Где Пушкин?</title>

<meta property="og:description" content="Отличите настоящего Пушкина от стихов нейросети Claude.">

<style>
/* Бумага и чернила: одна колонка, стихи — серифом, интерфейс — гротеском */
:root {
  --paper: #f7f3ea; --card: #fdfbf6; --ink: #1d2230; --muted: #5d6474; --line: #ddd5c5;
  --accent: #2b4a7e; --accent-soft: #e4e9f3; --good: #2f6b45; --bad: #9b3b2f;
  --serif: "PT Serif", Georgia, "Times New Roman", serif; --sans: "PT Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #171a21; --card: #1e222b; --ink: #ece6d9; --muted: #a9a294; --line: #343a46;
    --accent: #9db6e4; --accent-soft: #263248; --good: #7fc79a; --bad: #e39b8f; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); }
main { max-width: 56rem; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 clamp(2.4rem, 7vw, 3.6rem)/1.1 var(--serif); margin: 0; text-wrap: balance; }
h2 { font: 700 1.6rem/1.2 var(--serif); margin: 2.5rem 0 1rem; }
.rule { width: 4rem; height: 1px; background: var(--accent); margin: .9rem 0 1.6rem; }
.lead { font: 1.12rem/1.65 var(--serif); max-width: 38rem; }
fieldset { border: 0; padding: 0; margin: 2rem 0 0; max-width: 38rem; }
legend { font-weight: 700; font-size: 1.1rem; margin-bottom: .8rem; }
.opt { display: flex; gap: .7rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 3px; padding: .75rem 1rem; margin-bottom: .5rem; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: .35rem; accent-color: var(--accent); }
button { font: 700 1rem var(--sans); border-radius: 3px; cursor: pointer; padding: .8rem 1.5rem; }
button:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--paper); border: 1px solid var(--accent); }
.primary:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-weight: 400; }
.progress { display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: var(--muted); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
.bar { width: 8rem; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.8rem; }
@media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.card { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 1.4rem 1.6rem; }
.label { font: 700 1.5rem var(--serif); color: var(--accent); }
.verse { font: 1.08rem/1.8 var(--serif); white-space: pre-line; margin: .6rem 0 0; }
.side .ghost { width: 100%; }
.stats { list-style: none; padding: 0; margin: 1.5rem 0 0; max-width: 34rem; }
.stats li { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: .5rem 0; }
.stats span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.6rem; }
.note { color: var(--muted); font-size: .9rem; margin-top: .6rem; }
.reveal { list-style: none; padding: 0; margin: 0; }
.reveal > li { border-top: 1px solid var(--line); padding: 1.2rem 0; }
.reveal .head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.good { color: var(--good); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: .8rem; }
@media (max-width: 720px) { .mini { grid-template-columns: 1fr; } }
.mini > div { border: 1px solid var(--line); border-radius: 3px; padding: .9rem 1rem; min-width: 0; }
.mini > div.chosen { border-color: var(--accent); }
.mini .who { font-size: .9rem; }
.mini .verse { font-size: .92rem; line-height: 1.6; }
input.url { width: 100%; max-width: 28rem; font: .95rem var(--sans); padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--ink); margin-top: .7rem; }
footer { max-width: 56rem; margin: 2rem auto 0; padding: 1.2rem max(16px, env(safe-area-inset-left, 0px)) 2rem max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }
</style>

<body>
<main id="app"></main>
<footer>Тексты Пушкина — общественное достояние. Подделки написаны нейросетью Claude (Anthropic). Анонимно: сохраняются только ответы и уровень знания поэзии. Это зеркало теста <a href="https://gde-pushkin.lovable.app">gde-pushkin.lovable.app</a> для тех, у кого он не открывается.</footer>
<script>
const PAIRS = [{"id": 1, "pushkin_title": "«Юрьеву» («Любимец ветреных Лаис…», 1821)", "real": "Любимец ветреных Лаис,\nПрелестный баловень Киприды —\nУмей сносить, мой Адонис,\nЕе минутные обиды!\nОна дала красы младой\nТебе в удел очарованье,\nИ черный ус, и взгляд живой,\nЛюбви улыбку и молчанье.", "fake": "Питомец резвых аонид,\nПовеса, друг мой легкокрылый!\nТебя ли сплин отяготит?\nТебе ли мил приют унылый?\nПускай Фортуна за столом\nТебе вчера не улыбнулась:\nНо Вакх с тобой, и полон дом\nДрузей — и радость к нам вернулась."}, {"id": 2, "pushkin_title": "«На тихих берегах Москвы…» (1822)", "real": "На тихих берегах Москвы\nЦерквей, венчанные крестами,\nСияют ветхие главы\nНад монастырскими стенами.\nКругом простерлись по холмам\nВовек не рубленные рощи,\nИздавна почивают там\nУгодника святые мощи.", "fake": "Близ Пскова, в тишине полей,\nПод сенью липовой аллеи\nБелеет церковь меж ветвей,\nГде спит смиренно Пелагея.\nТам в праздник с ближних деревень\nНарод стекается толпою,\nИ долго длится летний день\nНад этой тихою землею."}, {"id": 3, "pushkin_title": "«К бюсту завоевателя» (1829)", "real": "Напрасно видишь тут ошибку:\nРука искусства навела\nНа мрамор этих уст улыбку,\nА гнев на хладный лоск чела.\nНедаром лик сей двуязычен.\nТаков и был сей властелин:\nК противочувствиям привычен,\nВ лице и в жизни арлекин.", "fake": "Не диво, что в его портрете\nСмеется рот, а взор суров:\nТаков он был и в кабинете,\nИ в зале, полной орденов.\nОн с нами — ласков и приветлив,\nС просителем — сердит и строг;\nХудожник был весьма приметлив\nИ угодить обоим смог."}, {"id": 4, "pushkin_title": "«Аквилон» (1824)", "real": "Зачем ты, грозный аквилон,\nТростник прибрежный долу клонишь?\nЗачем на дальний небосклон\nТы облачко столь гневно гонишь?\nНедавно черных туч грядой\nСвод неба глухо облекался,\nНедавно дуб над высотой\nВ красе надменной величался...", "fake": "Куда стремишься, вал морской,\nСедою пеною клубяся?\nЗачем с угрюмою тоской\nТы бьешься в берег, разбиваясь?\nНе так ли в юности моей\nКипели страсти безрассудно\nИ о гранит холодных дней\nДробились пылью изумрудной?"}, {"id": 5, "pushkin_title": "«Делибаш» (1829)", "real": "Перестрелка за холмами;\nСмотрит лагерь их и наш;\nНа холме пред казаками\nВьется красный делибаш.\nДелибаш! не суйся к лаве,\nПожалей свое житье;\nВмиг аминь лихой забаве:\nПопадешься на копье.", "fake": "За рекой костры дымятся;\nСпит в тумане стан чужой;\nНам с рассветом в бой подняться,\nНынче — чарка да покой.\nЕсаул, налей полнее!\nЗавтра, может, нам не пить:\nПуля-дура всех вернее\nЗнает, как кого ловить."}, {"id": 6, "pushkin_title": "«Был и я среди донцов…» (1829)", "real": "Был и я среди донцов,\nГнал и я османов шайку;\nВ память битвы и шатров\nЯ домой привез нагайку.\nНа походе, на войне\nСохранил я балалайку —\nС нею рядом, на стене\nЯ повешу и нагайку.", "fake": "Видел я Казбек седой,\nПил чихирь в грузинской сакле\nИ вернулся я домой,\nКак актер в пустом спектакле.\nСабля, бурка да кинжал\nНад моей висят постелью;\nЯ бы с ними поскакал,\nДа сижу за канителью."}, {"id": 7, "pushkin_title": "«Ответ А. И. Готовцевой» (1829)", "real": "И недоверчиво и жадно\nСмотрю я на твои цветы.\nКто, строгий стоик, примет хладно\nПривет харит и красоты?\nГоржуся им — но и робею;\nТвой недосказанный упрек\nЯ разгадать вполне не смею.\nТвой гнев ужели я навлек?", "fake": "Благодарю: в твоем посланье\nЯ слышу ласку и укор.\nМне сладко это порицанье,\nКак нежный тайный разговор.\nНе я ль виной твоей печали?\nНе я ль забыл твой скромный дом?\nПрости! меня в столицу звали\nДолги, журналы — и Содом."}, {"id": 8, "pushkin_title": "«Наперсница волшебной старины…» (1822)", "real": "Наперсница волшебной старины,\nДруг вымыслов игривых и печальных,\nТебя я знал во дни моей весны,\nВо дни утех и снов первоначальных.\nЯ ждал тебя; в вечерней тишине\nЯвлялась ты веселою старушкой,\nИ надо мной сидела в шушуне,\nВ больших очках и с резвою гремушкой.", "fake": "Знакомый сад! в твоей густой тени\nЯ рос, мечтатель резвый и беспечный;\nЗдесь протекли младенческие дни\nПод шепот лип и ропот речки вечный.\nЗдесь в первый раз, в тени у родника,\nЯ развернул заветные тетради,\nИ робкая, неопытна рука\nЧертила стих — забавы музы ради."}, {"id": 9, "pushkin_title": "«Дева» (1821)", "real": "Я говорил тебе: страшися девы милой!\nЯ знал, она сердца влечет невольной силой.\nНеосторожный друг! я знал, нельзя при ней\nИную замечать, иных искать очей.\nНадежду потеряв, забыв измены сладость,\nПылает близ нее задумчивая младость;\nЛюбимцы счастия, наперсники Судьбы\nСмиренно ей несут влюбленные мольбы;", "fake": "Не верь, мой юный друг, улыбке томной, лживой!\nНе верь ее очам и речи шаловливой:\nОна играет всем — и вздохом, и слезой,\nИ сердцем, и судьбой, и бедною тобой.\nВчера она со мной, склонясь над фортепьяно,\nШептала мне слова из нового романа;\nА нынче, говорят, на бале у князей\nТем самым шепотом пленяла двух гостей."}, {"id": 10, "pushkin_title": "«Иностранке» (1822)", "real": "На языке тебе невнятном\nСтихи прощальные пишу,\nНо в заблуждении приятном\nВниманья твоего прошу:\nМой друг, доколе не увяну,\nВ разлуке чувство погубя,\nБоготворить не перестану\nТебя, мой друг, одну тебя.", "fake": "Листок, исписанный небрежно,\nТебе на память я дарю:\nПусть он тебе напомнит нежно\nПоследний вечер и зарю.\nКогда в краю твоем далеком\nТебя рассеет шумный свет,\nВзгляни сюда — и ненароком\nВздохни о том, кого уж нет."}];
const PAIRS_R2 = [{"id": 11, "pushkin_title": "«Я думал, сердце позабыло…» (1835)", "real": "Я думал, сердце позабыло\nСпособность легкую страдать,\nЯ говорил: тому, что было,\nУж не бывать! уж не бывать!\nПрошли восторги, и печали,\nИ легковерные мечты...\nНо вот опять затрепетали\nПред мощной властью красоты.", "fake": "Я мнил, что Муза отлетела\nИ не воротится ко мне,\nЧто лира, праздная, истлела,\nКак лист осенний, в тишине.\nПрошли года; я стал спокоен,\nХозяйством, тяжбами пленен...\nНо кем же вновь мой слух настроен?\nЧей это шепот, этот звон?"}, {"id": 12, "pushkin_title": "«Ex ungue leonem» (1830)", "real": "Недавно я стихами как-то свистнул\nИ выдал их без подписи моей;\nЖурнальный шут о них статейку тиснул,\nБез подписи ж пустив ее, злодей.\nНо что ж? Ни мне, ни площадному шуту\nНе удалось прикрыть своих проказ:\nОн по когтям узнал меня в минуту,\nЯ по ушам узнал его как раз.", "fake": "Мой критик строгий книги не читает:\nЕму довольно имени творца;\nОн по заглавью тотчас угадает,\nКак скучен том с начала до конца.\nВчера ему без имени, в журнале,\nЯ свой отрывок робко подослал;\nОн похвалил; узнав меня, в печали\nБедняга отступился от похвал."}, {"id": 13, "pushkin_title": "«Ответ» («Я вас узнал, о мой оракул!…», 1830)", "real": "Я вас узнал, о мой оракул!\nНе по узорной пестроте\nСих неподписанных каракул,\nНо по веселой остроте,\nНо по приветствиям лукавым,\nНо по насмешливости злой\nИ по упрекам... столь неправым,\nИ этой прелести живой.", "fake": "Вы мне твердите: я неверен,\nЯ сердце раздаю шутя,\nЯ в нежных клятвах лицемерен\nИ своенравен, как дитя.\nУпрек, быть может, справедливый,\nНо кто же в мире без греха?\nВы сами, друг мой прихотливый,\nСмеялись над огнем стиха."}, {"id": 14, "pushkin_title": "«Ты вянешь и молчишь…» (1817)", "real": "Ты вянешь и молчишь; печаль тебя снедает;\nНа девственных устах улыбка замирает.\nДавно твоей иглой узоры и цветы\nНе оживлялися. Безмолвно любишь ты\nГрустить. О, я знаток в девической печали;\nДавно глаза мои в душе твоей читали.\nЛюбви не утаишь: мы любим, и как нас,\nДевицы нежные, любовь волнует вас.", "fake": "Ты едешь в первый раз на бал, дрожа, робея;\nТы в белом, и стройна, как юная лилея;\nТам ждут тебя огни, и музыка, и шум,\nИ взоры юношей, и лесть, и праздный ум;\nТы будешь весела... но верь мне, дорогая:\nЯ знаю этот блеск — он гаснет, не сгорая,\nИ часто, воротясь домой в ночной тиши,\nМы плачем, не поняв волнения души."}, {"id": 15, "pushkin_title": "«Когда владыка ассирийский…» (1835)", "real": "Когда владыка ассирийский\nНароды казнию казнил,\nИ Олоферн весь край азийский\nЕго деснице покорил, —\nВысок смиреньем терпеливым\nИ крепок верой в бога сил,\nПеред сатрапом горделивым\nИзраил выи не склонил.", "fake": "Пирует царь; вином хмельные,\nШумят вельможи до зари;\nСосуды храма золотые\nЕму подносят: пей, цари!\nИ вдруг, средь буйного веселья,\nРука чертит, светясь, слова,\nИ царь, как бы от злого зелья,\nБледнеет; никнет голова."}, {"id": 16, "pushkin_title": "«Дорида» (1819)", "real": "В Дориде нравятся и локоны златые,\nИ бледное лицо, и очи голубые...\nВчера, друзей моих оставя пир ночной,\nВ ее объятиях я негу пил душой;\nВосторги быстрые восторгами сменялись,\nЖеланья гасли вдруг и снова разгорались;\nЯ таял; но среди неверной темноты\nДругие милые мне виделись черты.", "fake": "Я видел: Лидия в тени густой оливы\nДремала в полдень; зной томил пустые нивы;\nЯ с замираньем чувств к ней тихо подошел;\nРучей у ног журчал, и рой кружился пчел;\nЕе уста, как мак, от зноя пламенели,\nИ перси юные под легкой тканью млели;\nЯ поцелуй украл — и, пробудясь, она\nМне улыбнулась... ах! не вовсе ото сна."}, {"id": 17, "pushkin_title": "«Генералу Пущину» (1821)", "real": "В дыму, в крови, сквозь тучи стрел\nТеперь твоя дорога;\nНо ты предвидишь свой удел,\nГрядущий наш Квирога!\nИ скоро, скоро смолкнет брань\nСредь рабского народа,\nТы молоток возьмешь во длань\nИ воззовешь: свобода!", "fake": "Ты едешь в Грецию, мой друг,\nГде льется кровь свободы;\nПокинув праздный наш досуг,\nПиры, стихи и моды.\nТам, где Гомер когда-то пел,\nГремит набат священный;\nИ я б с тобою полетел,\nДа я — поэт смиренный."}, {"id": 18, "pushkin_title": "«Мордвинову» (1826)", "real": "Под хладом старости угрюмо угасал\nЕдиный из седых орлов Екатерины.\nВ крылах отяжелев, он небо забывал\nИ Пинда острые вершины.\nВ то время ты вставал: твой луч его согрел,\nОн поднял к небесам и крылья и зеницы\nИ с шумной радостью взыграл и полетел\nВо сретенье твоей денницы.", "fake": "Ты славу заслужил: тебе внимал народ,\nТебя в годину бед благословлял и воин;\nТеперь, в тени дубрав, вдали людских забот,\nТы сладкой праздности достоин.\nНо если вновь труба раздастся над тобой,\nТы вспомнишь юных лет порыв и пыл военный\nИ, бросив мирный плуг, поскачешь в новый бой,\nКак древний Цинциннат почтенный."}, {"id": 19, "pushkin_title": "«Нет, нет, не должен я, не смею, не могу…» (1834)", "real": "Нет, нет, не должен я, не смею, не могу\nВолнениям любви безумно предаваться;\nСпокойствие мое я строго берегу\nИ сердцу не даю пылать и забываться;\nНет, полно мне любить; но почему ж порой\nНе погружуся я в минутное мечтанье,\nКогда нечаянно пройдет передо мной\nМладое, чистое, небесное созданье?", "fake": "Я дал себе обет: в уединенье жить,\nНе ведать суеты, ни зависти, ни славы;\nПокорный долгу, я привык себя смирить\nИ презирать давно столичные забавы;\nЯ книгам предан стал; но если в тишине\nРаздастся под окном веселый звон почтовый,\nЗачем же сердце вновь трепещет, как во сне,\nИ ждет, как в старину, письма иль встречи новой?"}, {"id": 20, "pushkin_title": "«Дон» (1829)", "real": "Блеща средь полей широких,\nВон он льется!... Здравствуй, Дон!\nОт сынов твоих далеких\nЯ привез тебе поклон.\nКак прославленного брата,\nРеки знают тихий Дон;\nОт Аракса и Евфрата\nЯ привез тебе поклон.", "fake": "Горы, горы! за спиною\nТают в синей вышине;\nСтепь легла передо мною,\nСладко, грустно было мне.\nТам, на кладбище высоком,\nСпит товарищ молодой;\nДева с черным, томным оком\nМашет мне вослед рукой."}];
// Хранилище — Google-форма владельца: отправка «вслепую» (no-cors), ответ не читается.
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdAfatM2kh-1vSV0Iy72AA88NEHe22pVPJyyS3i6GhfgMYaqw/formResponse';
const FIELD = 'entry.1606822397';
// Снимок общего подсчёта: зеркало не читает базу, цифры обновляются вручную.
const SNAPSHOT = { label: 'Средний счёт первого раунда (больше 250 человек)', avg: 4.7 };
// Раунд выбирается адресом: ?round=2 — второй, иначе первый.
const ROUND = new URLSearchParams(location.search).get('round') === '2' ? 2 : 1;
const ROUND_PAIRS = ROUND === 2 ? PAIRS_R2 : PAIRS;
const DONE_KEY = ROUND === 2 ? 'where-pushkin-done-r2' : 'where-pushkin-done';
const OTHER_KEY = ROUND === 2 ? 'where-pushkin-done' : 'where-pushkin-done-r2';
const BASE_URL = location.origin + location.pathname;
const ROUND_URL = BASE_URL + (ROUND === 2 ? '?round=2' : '');
const OTHER_URL = BASE_URL + (ROUND === 2 ? '' : '?round=2');
const EXPERTISE = [
  ['casual', 'Читаю стихи редко'],
  ['lover', 'Люблю стихи, читаю для себя'],
  ['expert', 'Профессионально: филолог, учитель литературы, пишу стихи'],
];
const app = document.getElementById('app');
let state = { expertise: null, items: [], index: 0, answers: [], started: 0, pairStart: 0 };

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seen(key) { try { return localStorage.getItem(key) === '1'; } catch (e) { return false; } }
function markDone() { try { localStorage.setItem(DONE_KEY, '1'); } catch (e) { /* без хранилища просто не помечаем */ } }

function intro() {
  app.innerHTML = `
    <h1>${ROUND === 2 ? 'Где Пушкин? Раунд 2' : 'Где Пушкин?'}</h1><div class="rule"></div>
    <p class="lead">${ROUND === 2
      ? '10 новых пар по восемь строк. В каждой паре один отрывок — настоящий Пушкин, малоизвестные стихи 1817–1835 годов. Второй написала нейросеть Claude тем же размером и с той же рифмовкой. В первом раунде больше 250 читателей угадали в среднем 4,7 из 10 — не лучше, чем наугад. Ответы анонимны и идут в общий подсчёт.'
      : 'Перед вами 10 пар стихотворных отрывков по восемь строк. В каждой паре один отрывок — настоящий Пушкин, малоизвестные ранние стихи. Второй написала нейросеть Claude тем же размером и с той же рифмовкой. Выберите, где Пушкин. Ответы анонимны и идут в общий подсчёт: мы проверяем, отличают ли читатели Пушкина от машины.'}</p>
    <fieldset><legend>Как хорошо вы знаете поэзию?</legend>
      ${EXPERTISE.map(([v, l]) => `<label class="opt"><input type="radio" name="exp" id="exp-${v}" value="${v}" ${state.expertise === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}
    </fieldset>
    <div class="row"><button class="primary" id="start" ${state.expertise ? '' : 'disabled'}>Начать</button></div>
    ${ROUND === 1 ? `<p class="note"><a href="${esc(OTHER_URL)}">Уже проходили? Раунд 2 — 10 новых пар →</a></p>` : ''}`;
  app.querySelectorAll('input[name=exp]').forEach(r => r.addEventListener('change', () => { state.expertise = r.value; app.querySelector('#start').disabled = false; }));
  app.querySelector('#start').addEventListener('click', start);
}

function start() {
  state.items = shuffle(ROUND_PAIRS).map(pair => ({ pair, realSide: Math.random() < 0.5 ? 'A' : 'B' }));
  state.index = 0; state.answers = []; state.started = Date.now(); state.pairStart = Date.now();
  pairView(); scrollTo(0, 0);
}

function pairView() {
  const { pair, realSide } = state.items[state.index];
  const text = side => esc(side === realSide ? pair.real : pair.fake);
  app.innerHTML = `
    <div class="progress"><span>Пара ${state.index + 1} из ${state.items.length}</span><span class="bar"><i style="width:${state.index / state.items.length * 100}%"></i></span></div>
    <div class="pair">${['A', 'B'].map(s => `
      <div class="side"><article class="card"><div class="label">${s === 'A' ? 'А' : 'Б'}</div><p class="verse">${text(s)}</p></article>
      <button class="ghost" data-side="${s}">Это Пушкин</button></div>`).join('')}</div>`;
  app.querySelectorAll('[data-side]').forEach(b => b.addEventListener('click', () => choose(b.dataset.side)));
}

function choose(side) {
  const item = state.items[state.index], now = Date.now();
  state.answers.push({ pair_id: item.pair.id, position: state.index + 1, real_side: item.realSide, chosen: side,
                       correct: side === item.realSide, ms: now - state.pairStart });
  state.pairStart = now;
  if (++state.index < state.items.length) { pairView(); scrollTo(0, 0); } else { finish(); }
}

function finish() {
  const score = state.answers.filter(a => a.correct).length;
  const payload = { source: 'mirror', round: ROUND, expertise: state.expertise, score, answers: state.answers,
                    duration_ms: Date.now() - state.started, is_repeat: seen(DONE_KEY), played_other: seen(OTHER_KEY) };
  const body = new URLSearchParams({ [FIELD]: JSON.stringify(payload) });
  fetch(FORM, { method: 'POST', mode: 'no-cors', body }).then(markDone).catch(() => {
    const n = document.getElementById('save-note'); if (n) n.hidden = false;
  });
  results(score); scrollTo(0, 0);
}

function results(score) {
  const url = ROUND_URL;
  app.innerHTML = `
    <h1>Вы угадали ${score} из 10.</h1>
    <p class="note" id="save-note" hidden>Не удалось сохранить ответ, но ваш результат здесь.</p>
    <ul class="stats"><li><span>${SNAPSHOT.label}</span><span>${String(SNAPSHOT.avg).replace('.', ',')} из 10</span></li>
      <li><span>Наугад</span><span>5 из 10</span></li></ul>
    <div class="row"><button class="primary" id="copy">Скопировать ссылку</button><button class="ghost" id="again">Пройти ещё раз</button>
      <button class="ghost" id="other">${ROUND === 2 ? 'Первый раунд' : 'Раунд 2: новые пары'}</button></div>
    <p class="note" id="copied" hidden>Ссылка скопирована.</p>
    <input class="url" id="url" value="${esc(url)}" readonly hidden>
    <h2>Ответы</h2>
    <ol class="reveal">${state.items.map((item, i) => {
      const a = state.answers[i];
      return `<li><div class="head"><span>Пара ${i + 1}</span><span class="${a.correct ? 'good' : 'bad'}">${a.correct ? 'Угадали' : 'Не угадали'}</span></div>
        <div class="mini">${['A', 'B'].map(s => {
          const real = s === item.realSide;
          return `<div class="${a.chosen === s ? 'chosen' : ''}"><div class="who"><b>${s === 'A' ? 'А' : 'Б'}</b> · ${real ? '<b>Пушкин — ' + esc(item.pair.pushkin_title) + '</b>' : 'Claude'}${a.chosen === s ? ' · ваш выбор' : ''}</div>
            <p class="verse">${esc(real ? item.pair.real : item.pair.fake)}</p></div>`;
        }).join('')}</div></li>`;
    }).join('')}</ol>`;
  app.querySelector('#again').addEventListener('click', () => { intro(); scrollTo(0, 0); });
  app.querySelector('#other').addEventListener('click', () => { location.href = OTHER_URL; });
  app.querySelector('#copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); app.querySelector('#copied').hidden = false; }
    catch (e) { const u = app.querySelector('#url'); u.hidden = false; u.focus(); u.select(); }
  });
}

if (ROUND === 2) {
  document.title = 'Где Пушкин? Раунд 2';
  document.querySelector('footer a').href = 'https://gde-pushkin.lovable.app/r2';
}
intro();
</script>
</body>
</html>
